<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>休.com</title>
	<link rel="stylesheet" type="text/css" href="/css/Aikawa.css">

	<!-- Google Fonts 読み込み -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
		rel="stylesheet">
</head>

<body>
	<main>
		<h2>登録宿一覧</h2><br><br>
		<div class="aa">
		
			<div class="row">
				<div class="col" th:each="hotel : ${hotels}">
					<a th:href="@{/admin/detail/{id}(id=${hotel.id})}">
						<div class="div4">
							<img th:src="${hotel.image}" height="170px" width="100%" alt="ホテル画像">
							<div class="popo">
								<h3 th:text="${hotel.name}"></h3>
								<div th:text="${hotel.address}"></div>
							</div>
							<div class="popo2">
								<div th:text="${hotel.capacity} + '名 税込　'"></div>
								<h3 th:text="${hotel.price} + '円'"></h3>
							</div>
						</div>
					</a>
				</div>
			</div>
		</div>
		
	</main>

</body>

</html>
