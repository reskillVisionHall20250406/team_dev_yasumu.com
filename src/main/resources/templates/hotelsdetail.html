<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>商品詳細ページ</title>
	<link rel="stylesheet" type="text/css" href="/css/Aikawa.css">
	<link rel="stylesheet" type="text/css" href="/css/review.css">

	<style>
		/* 基本設定 */
		* {
			box-sizing: border-box;
		}

		body {

			font-family: 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			line-height: 1.6;
		}

		/* メインコンテナ */
		.im {
			max-width: 1200px;
			margin: 0 auto;
			padding: 0 15px;
		}

		/* 画像と詳細の2カラムレイアウト */
		.content-wrapper {
			display: flex;
			gap: 30px;
			margin-bottom: 40px;
		}

		.image-section {
			flex: 1;
		}

		.info-section {
			flex: 1;
			padding: 20px 0;
		}

		.image-section img {
			width: 100%;
			height: 350px;
			border-radius: 12px;
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
			margin-top: 25px;
		}

		.detail3 {
			margin-top: 15px;
			color: #666;
			font-size: 14px;
			line-height: 1.6;
		}

		/* ホテル情報セクション */
		.hotel-title {
			font-size: 28px;
			font-weight: 700;
			color: rgb(88, 88, 88);
			margin-bottom: 15px;
			line-height: 1.3;
			padding-top: 20px;
		}

		.tags-container {
			margin: 15px 0;
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.tag-item {
			background-color: #e8f4f8;
			color: #2c5aa0;
			padding: 6px 12px;
			border-radius: 20px;
			font-size: 13px;
			font-weight: 500;
			border: 1px solid #d1e7ed;
		}

		.hotel-meta {
			background: #f8f9fa;
			padding: 20px;
			border-radius: 12px;
			margin: 20px 0;
		}

		.address {
			font-size: 16px;
			color: #666;
			margin-bottom: 10px;
			display: flex;
			align-items: center;
		}

		.address::before {
			content: "📍";
			margin-right: 8px;
		}

		.rating-section {
			display: flex;
			align-items: center;
			gap: 10px;
			margin-bottom: 15px;
		}

		.star-rating2 {
			font-size: 18px;
			font-weight: 700;
			color: gold;
		}

		.star-rating {
			display: flex;
			gap: 2px;
		}

		.star {
			font-size: 20px;
			color: #ddd;
		}

		.star.filled {
			color: gold;
		}

		.star.half {
			background: linear-gradient(90deg, gold 50%, #ddd 50%);
			background-clip: text;
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}

		/* 価格とボタン */
		.price-section {

			padding: 25px;
			border-radius: 15px;
			text-align: center;
			margin: 30px 0;
			color: rgb(85, 85, 85);
		}

		.price {
			font-size: 32px;
			font-weight: 500;
			margin-bottom: 15px;
			margin-top: 5vh;
			text-align: right;
		}

		.button-3 {
			background: rgb(0, 108, 217);
			color: rgb(255, 255, 255);
			border: none;
			padding: 15px 40px;
			font-size: 18px;
			font-weight: 700;
			border-radius: 50px;
			cursor: pointer;
			transition: all 0.3s;
			box-shadow: 0 4px 4px rgba(0, 0, 0, 0.05);
		}

		.button-3:hover {
			transform: translateY(-2px);
			box-shadow: 0 4px 4px rgba(0, 0, 0, 0.15);
		}

		/* レビューセクション */
		.reviews-section {
			margin-top: 50px;
		}

		.box-015 {
			border-radius: 12px;
			font-size: 15px;
			font-weight: 600;
			text-align: center;
			margin-bottom: 30px;
		}

		.reviews-wrapper {
			background: #f8f9fa;
			padding: 20px;
			border-radius: 12px;
		}

		.box-017 {
			background: white;
			padding: 20px;
			border-radius: 12px;
			margin-bottom: 15px;
			box-shadow: 0 4px 4px rgba(0, 0, 0, 0.05);
		}

		.star-color3 {
			display: flex;
			align-items: center;
			margin-bottom: 10px;
			font-size: 16px;
		}

		.star-color {
			color: gold;
		}

		.star-color2 {
			color: #ddd;
		}

		/* レビュー投稿フォーム */
		.review-form {
			background: white;
			padding: 30px;
			border-radius: 12px;
			margin-top: 30px;
			box-shadow: 0 4px 4px rgba(0, 0, 0, 0.1);
			margin-bottom: 30vh;
		}

		.font {
			font-size: 20px;
			font-weight: 600;
			color: rgb(83, 83, 83);
			margin-bottom: 20px;
		}

		.star-rating2 input[type="radio"] {
			display: none;
		}

		.star-rating2 label {
			font-size: 24px;
			color: #ddd;
			cursor: pointer;
			transition: color 0.2s;
		}

		.star-rating2 input[type="radio"]:checked~label,
		.star-rating2 label:hover,
		.star-rating2 label:hover~label {
			color: gold;
		}

		.textbox-2 {
			width: 100%;
			padding: 15px;
			border: 2px solid #e1e5e9;
			border-radius: 8px;
			font-size: 16px;
			font-family: inherit;
			resize: vertical;
			min-height: 120px;
		}

		.textbox-2:focus {
			outline: none;
			border-color: #667eea;
			box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
		}

		.button-03 {

			color: white;
			border: none;
			padding: 15px 30px;
			font-size: 16px;
			font-weight: 600;
			border-radius: 8px;
			cursor: pointer;
			transition: all 0.3s;
			margin-top: 15px;
		}

		.button-03:hover {
			transform: translateY(-2px);
			box-shadow: 0 6px 20px rgba(102, 126, 234, 0.3);
		}

		/* モバイル対応 */


		/* スマートフォン対応 */
		@media (max-width: 480px) {
			.im {
				padding: 0 10px;
			}

			.content-wrapper {
				gap: 15px;
				margin-bottom: 30px;
			}

			.image-section img {
				height: 250px;
				margin-top: 10px;
			}

			.hotel-title {
				font-size: 20px;
				margin-bottom: 12px;
			}

			.tags-container {
				gap: 6px;
				margin: 12px 0;
			}

			.tag-item {
				font-size: 12px;
				padding: 4px 8px;
			}

			.hotel-meta {
				padding: 12px;
				margin: 15px 0;
			}

			.address {
				font-size: 14px;
			}

			.rating-section {
				gap: 8px;
			}

			.star-rating2 {
				font-size: 16px;
			}

			.star {
				font-size: 18px;
			}

			.price-section {
				padding: 15px;
				margin: 20px 0;
			}

			.price {
				font-size: 24px;
				margin-bottom: 12px;
			}

			.button-3 {
				padding: 12px 30px;
				font-size: 16px;
			}

			.reviews-section {
				margin-top: 30px;
			}

			.box-015 {
				font-size: 16px;
				padding: 15px;
				margin-bottom: 20px;
			}

			.reviews-wrapper {
				padding: 15px;
			}

			.box-017 {
				padding: 15px;
				margin-bottom: 12px;
			}

			.star-color3 {
				font-size: 14px;
				margin-bottom: 8px;
			}

			.review-form {
				padding: 20px 15px;
				margin-top: 20px;
			}

			.font {
				font-size: 18px;
				margin-bottom: 15px;
			}

			.star-rating2 label {
				font-size: 22px;
			}

			.textbox-2 {
				padding: 12px;
				font-size: 14px;
				min-height: 100px;
			}

			.button-03 {
				padding: 12px 20px;
				font-size: 14px;
				margin-top: 12px;
			}

			.detail3 {
				font-size: 20px;
				margin-top: 12px;
			}

			p {
				padding-left: 0px;
			}

			.header-name {
				font-size: 28px;
			}

			.header-text {
				font-size: 42px;
				text-decoration: none;
			}
		}

		/* 極小スマートフォン対応 */
		@media (max-width: 360px) {
			.im {
				padding: 0 8px;
			}

			.image-section img {
				height: 200px;
			}

			.hotel-title {
				font-size: 18px;
			}

			.price {
				font-size: 22px;
			}

			.tag-item {
				font-size: 11px;
				padding: 3px 6px;
			}

			.hotel-meta {
				padding: 10px;
			}

			.address {
				font-size: 13px;
			}

			.star-rating2 {
				font-size: 14px;
			}

			.star {
				font-size: 16px;
			}

			.box-015 {
				font-size: 14px;
				padding: 12px;
			}

			.reviews-wrapper {
				padding: 12px;
			}

			.box-017 {
				padding: 12px;
			}

			.review-form {
				padding: 15px 10px;
			}

			.font {
				font-size: 16px;
			}

			.star-rating2 label {
				font-size: 20px;
			}
		}

		/* カルーセル全体 */
		.carouselImg {
			/* 水平方向中央寄せ */
			width: 100%;
			height: 400px;
			display: flex;
			justify-content: center;
		}

		/* カルーセル内容 */
		.contains {
			/* サイズは自由に変更してください。*/
			/* 下の.slideも同じサイズにしてください。 */
			width: 100%;
			height: 400px;
			overflow: hidden;
			position: relative;
			object-fit: fill;
			padding: 0;
			list-style: none;
		}

		/* スライド切り換え用ラジオボタンは常に非表示 */
		.slide_select {
			display: none;
		}

		/* 各スライド */
		.slide {
			/* サイズは自由に変更してください。*/
			/* 上の.containsも同じサイズにしてください。 */
			width: 100%;
			height: 400px;
			overflow: hidden;
			position: absolute;
			/* スライドの初期値は選択されていないので透明にしておく */
			opacity: 0;
		}

		/* 前へ次へボタン */
		.scroll_button {
			position: absolute;
			display: block;
			height: 30px;
			width: 30px;
			/* 縦中央から20px上の位置 */
			top: 50%;
			margin-top: -20px;
			/* 上辺と右辺のみ幅5pxの枠線 */
			border-width: 5px 5px 0 0;
			border-style: solid;
			border-color: rgb(75, 75, 75);
			cursor: pointer;
			/* 普段はボタンはやや薄くする */
			opacity: 0.8;
			/* スライドよりも前面にする */
			z-index: 3;
		}

		/* ホバー時にボタンを強調 */
		.scroll_button:hover {
			opacity: 1;
		}

		/* 前へボタン */
		.scroll_prev {
			left: 15px;
			/* 上辺と右辺の枠線を回転して"＜"にする */
			transform: rotate(-135deg);
		}

		/* 次へボタン */
		.scroll_next {
			right: 15px;
			/* 上辺と右辺の枠線を回転して"＞"にする */
			transform: rotate(45deg);
		}

		/* スライド移動ボタンエリア */
		.move_controler {
			position: absolute;
			bottom: 20px;
			width: 100%;
			text-align: center;
		}

		/* スライド移動の各ボタン */
		.button_move {
			display: inline-block;
			height: 15px;
			width: 15px;
			margin: 0 2px;
			border-radius: 100%;
			cursor: pointer;
			/* 普段はやや薄くする */
			opacity: 0.5;
			/* スライドより前面にする */
			z-index: 2;
		}

		/* ホバー時はやや明るくする */
		.button_move:hover {
			opacity: 0.75;
		}

		/* スライド移動ボタンの色 */
		.button_move {
			background-color: #fdfdfd;
		}

		/* 1番目のスライド選択時 */
		/* 1番目のスライドの透明度を0にして表示する */
		.slide_select:nth-of-type(1):checked~.slide:nth-of-type(1) {
			opacity: 1;
		}

		/* スライド移動ボタンの1個目を明るくする */
		/* （今選択されていることが分かるように） */
		.slide_select:nth-of-type(1):checked~.move_controler .button_move:nth-of-type(1) {
			opacity: 1;
		}

		.slide_select:nth-of-type(2):checked~.slide:nth-of-type(2) {
			opacity: 1;
		}

		/* 2番目のスライド選択時（1番目のスライドと同じことをする） */
		.slide_select:nth-of-type(2):checked~.move_controler .button_move:nth-of-type(2) {
			opacity: 1;
		}

		/* 3番目のスライド選択時 */
		.slide_select:nth-of-type(3):checked~.slide:nth-of-type(3) {
			opacity: 1;
		}

		.slide_select:nth-of-type(3):checked~.move_controler .button_move:nth-of-type(3) {
			opacity: 1;
		}

		/* 4番目のスライド選択時 */
		.slide_select:nth-of-type(4):checked~.slide:nth-of-type(4) {
			opacity: 1;
		}

		.slide_select:nth-of-type(4):checked~.move_controler .button_move:nth-of-type(4) {
			opacity: 1;
		}
	</style>

	<!-- Google Fonts 読み込み -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
		rel="stylesheet">

</head>

<body>
	<header th:replace="header">
	</header>
	<main>
		<div class="im">
			<div class="content-wrapper">
				<div class="image-section">
					<div class="carouselImg">
						<!-- スライドのリスト -->
						<div class="contains">
							<!-- スライドを選択するためのラジオボタンリスト。 -->
							<!-- 数は増減しても構わないです。 最初は1番目を選択状態(checked)にします。-->
							<!-- Slide各ラジオボタンに個別のidを定義して、nameはすべて同じ値にします。 -->
							<input class="slide_select" type="radio" id="SlideA" name="slide_check" checked />
							<input class="slide_select" type="radio" id="SlideB" name="slide_check" />
							<input class="slide_select" type="radio" id="SlideC" name="slide_check" />
							<!-- スライド -->
							<!-- 上のラジオボックスと同じ数だけ記述します。-->
							<div class="slide">
								<!-- スライドの前へ、次へとスクロールさせるボタン -->
								<div class="scroll_controler">
									<!-- 前へボタン forで戻る先のラジオボタンのidを書きます。-->
									<!-- 先頭要素なので、最後のスライドのidである"SlideD"を書いています。 -->
									<label class="scroll_button scroll_prev" for="SlideC"></label>
									<!-- 次へボタン 上と同様にforで進む先のラジオボタンのidを書きます。-->
									<!-- 進み先は2番目の要素なので、2番目のスライドのid"SlideB"を書いています。 -->
									<label class="scroll_button scroll_next" for="SlideB"></label>
								</div>
								<!-- スライドの内容（ここでは画像）を記述します。 -->
								<!-- div要素に変えれば文字を加えることもできます。 -->
								<img th:src="${hotels.image}">
							</div>
							<!-- スライド（2番目）内容は1個めと同じ -->
							<div class="slide">
								<div class="controler_scroll">
									<label class="scroll_button scroll_prev" for="SlideA"></label>
									<label class="scroll_button scroll_next" for="SlideC"></label>
								</div>
								<img th:src="${hotels.image2}">
							</div>
							<!-- スライド（3番目）内容は1個めと同じ -->
							<div class="slide">
								<div class="controler_scroll">
									<label class="scroll_button scroll_prev" for="SlideB"></label>
									<label class="scroll_button scroll_next" for="SlideA"></label>
								</div>
								<img th:src="${hotels.image3}">
							</div>
							<!-- スライド（4番目）内容は1個めと同じ -->
							<div class="slide">
								<img th:src="${hotels.image}">
							</div>
							<!-- スライド移動用ボタン -->
							<div class="move_controler">
								<!-- 1個目のスライドのボタン -->
								<!-- 一番上のラジオボタンの1個目のスライドのid"A"をforに定義します-->
								<label class="button_move" for="SlideA"></label>
								<label class="button_move" for="SlideB"></label>
								<label class="button_move" for="SlideC"></label>
							</div>
						</div>
					</div>

					<p th:utext="${#strings.replace(hotels.detail, '\n', '<br/>')}" class="detail3">
					</p>
				</div>
				<div class="info-section">
					<h1 th:text="${hotels.name}" class="hotel-title"></h1>
					<div class="tags-container">
						<span th:each="tag : ${hotels.tags}" th:text="${'#' + tag.name}" class="tag-item">
						</span>
					</div>
					<div class="hotel-meta">
						<div class="address" th:text="${hotels.address}"></div>
						<div class="rating-section">
							<div class="star-rating2">
								<span th:text="${hotels.stars}">0.0</span>
							</div>
							<div class="star-rating" th:attr="data-stars=${hotels.stars}">
								<span class="star">★</span>
								<span class="star">★</span>
								<span class="star">★</span>
								<span class="star">★</span>
								<span class="star">★</span>
							</div>
						</div>
					</div>
					<div class="price-section">
						<hr>
						<div class="price" th:text="${hotels.price}+'円'"></div>
						<form th:action="@{/reservation/days/{id}(id=${hotels.id})}" method="get">
							<button class="button-3">予約する</button>
						</form>
					</div>
				</div>

			</div>
			<hr>
			<div class="reviews-section">
				<div class="box-015">
					<span th:text="${hotels.name}+'に投稿された評価、感想'"></span>
				</div>

				<div class="reviews-wrapper">
					<div class="box-017" th:each="review : ${reviews}">
						<div th:switch="${review.star}">
							<div th:case="1" class="star-color3">
								<div class="star-color">★</div>
								<div class="star-color2">★★★★</div>
								<div class="star-color">　1</div>
							</div>
							<div th:case="2" class="star-color3">
								<div class="star-color">★★</div>
								<div class="star-color2">★★★</div>
								<div class="star-color">　2</div>
							</div>
							<div th:case="3" class="star-color3">
								<div class="star-color">★★★</div>
								<div class="star-color2">★★</div>
								<div class="star-color">　3</div>
							</div>
							<div th:case="4" class="star-color3">
								<div class="star-color">★★★★</div>
								<div class="star-color2">★</div>
								<div class="star-color">　4</div>
							</div>
							<div th:case="5" class="star-color3">
								<div class="star-color">★★★★★</div>
								<div class="star-color">　5</div>
							</div>
						</div>
						<span th:text="${review.comment}"></span>
					</div>
				</div>

				<span th:if="${account.name != null}">
					<div class="review-form">
						<form th:action="@{/hotelsdetail/comment/{id}(id=${hotels.id})}" method="get">
							<div class="font">感想・評価を投稿する</div>
							<div class="star-rating2">
								<input type="radio" id="star5" name="star" value="5"><label for="star5">★</label>
								<input type="radio" id="star4" name="star" value="4"><label for="star4">★</label>
								<input type="radio" id="star3" name="star" value="3"><label for="star3">★</label>
								<input type="radio" id="star2" name="star" value="2"><label for="star2">★</label>
								<input type="radio" id="star1" name="star" value="1" checked><label
									for="star1">★</label>
							</div>
							<label>
								<textarea class="textbox-2" name="comment" rows="4" cols="50"
									placeholder="レビューを入力してください"></textarea>
								<button type="submit" class="button-03">投稿する</button>
							</label>
						</form>
					</div>
				</span>
			</div>
		</div>
	</main>
	<script>
		document.querySelectorAll('.star-rating').forEach(starRating => {
			const stars = starRating.querySelectorAll('.star');
			const rating = parseFloat(starRating.getAttribute('data-stars'));

			stars.forEach((star, i) => {
				star.classList.remove('filled', 'half');
				if (rating >= i + 1) {
					star.classList.add('filled');
				} else if (rating > i && rating < i + 1) {
					star.classList.add('half');
				}
			});
		});

		// スター評価のインタラクティブ機能
		document.querySelectorAll('.star-rating2 input[type="radio"]').forEach(input => {
			input.addEventListener('change', function () {
				const value = this.value;
				const labels = this.closest('.star-rating2').querySelectorAll('label');

				labels.forEach((label, index) => {
					if (index >= (5 - value)) {
						label.style.color = 'gold';
					} else {
						label.style.color = '#ddd';
					}
				});
			});
		});
	</script>
</body>

</html>
